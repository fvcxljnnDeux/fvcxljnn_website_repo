        <h1>Trostloses Sinnen vor dem Schlaf</h1>

        <p>Meine Füße sind kalt,<br />
Meine Müdigkeit alt –<br />
Und ich der Sklave des Winters.</p>
<p>Die Bäume sind kahl,<br />
Meine Träume banal –<br />
Und als Opfer fordern sie Kinder.</p>
