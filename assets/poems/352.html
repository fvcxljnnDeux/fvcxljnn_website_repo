        <h1>Für Wasser</h1>

        <p>Für Wasser bist du<br />
Nur ein Warteraum –<br />
Es tritt in dich<br />
Ein, durchläuft verschiedene Stufen<br />
Des Wartens, bis es dich verlässt.<br />
Doch solange die Schlange<br />
Noch ansteht,<br />
Kannst auch<br />
Du<br />
In Ruhe warten.</p>
