        <h1>Für die Erde ist's ein Blinzeln</h1>

        <p>Für die Erde ist's ein Blinzeln,<br />
Und auch mir kam's wie eines vor –<br />
Man arbeitet, die Zeit verstreicht –<br />
Und plötzlich grüßt die Sonne<br />
Mit einem grellen Strahlenflor.</p>
