        <h1>Alibi-Poem III</h1>

        <p>Ein letztes Mal greif' ich zum Stift<br />
Ohne Absicht gut zu schreiben,<br />
Doch wenn der nächste Tag eintrifft,<br />
Verspreche ich, da lass ich's bleiben –<br />
Und werde wieder Mühe zeigen –<br />
Und werd mich hoch bemüht vorzeigen.</p>
