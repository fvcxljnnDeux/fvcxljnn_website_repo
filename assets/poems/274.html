        <h1>Das Driften durch den Tag</h1>

        <p>Das Driften durch den Tag,<br />
Von Konversation zu Konversation –<br />
Gesichter sammeln sich im Netz,<br />
Und eh' du dich's versiehst,<br />
Hast du ein soziales Umfeld –<br />
Und den halben Tag verquatscht.</p>
