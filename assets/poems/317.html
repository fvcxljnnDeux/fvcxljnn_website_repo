        <h1>Im Gähnen steckt ein Ruf –</h1>

        <p>Im Gähnen steckt ein Ruf –<br />
Ein sehnendes Verlangen –<br />
Nach dem Betreten, Stuf' um Stuf',<br />
Der Kammern, die den Traum verschlangen.</p>
