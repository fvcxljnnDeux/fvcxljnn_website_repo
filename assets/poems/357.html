        <h1>Anfang anzufangen</h1>

        <p>Wer sonst nur träumt, muss wirklich wollen –<br />
Und beginnen zu beginnen –<br />
Nur so gerät der Stein in's Rollen –<br />
Nur so kann man gewinnen.</p>
