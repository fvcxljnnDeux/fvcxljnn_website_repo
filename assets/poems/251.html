        <h1>Kopfschmerz/Herzterz</h1>

        <p>Mein Kopf schmerzt.<br />
Mein Herz fährt<br />
Durch jede Arterie<br />
In alle Winkel meines Körpers.<br />
Es lacht und scherzt<br />
Und wird zum Mörder<br />
Eines jeden seligen Ernstes,<br />
Den mein Körper dort erfährt.</p>
