        <h1>Zwei alte Gespenster</h1>

        <p>Im Dunkel der Nacht –<br />
In einiger Ferne –<br />
Ein einziges Fenster –<br />
Mit brennendem Licht.</p>
<p>Bei Mondschein erwacht –<br />
Als Zeugen der Sterne –<br />
Zwei alte Gespenster –<br />
Das Fenster und ich.</p>
