        <h1>untitled unfinished</h1>

        <p>Bis abends geschlafen, die Arbeit vertagt –<br />
Vertan, das Geplante in Taten zu flechten –<br />
Als brächten Vorhaben der prächtigen Art,<br />
Das Werden zum Tag von solch mächtigen Nächten.</p>
