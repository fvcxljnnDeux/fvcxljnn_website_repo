        <h1>Sind deine Aug' geöffnet</h1>

        <p>Sind deine Aug' geöffnet,<br />
So siehst du in die Welt hinein,<br />
Doch schließt du sie bei Kerzenschein,<br />
Erlernst du erst, du selbst zu sein.</p>
