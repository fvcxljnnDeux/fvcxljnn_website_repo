        <h1>Ich wollte reimen</h1>

        <p>Ich wollte reimen,<br />
Doch ich kann wohl nicht –<br />
Ich bin zu drunk,<br />
Ich bin zu dicht;<br />
Und doch, denk ich, das war es wert –<br />
Bevor die Chance für immer fährt.</p>
