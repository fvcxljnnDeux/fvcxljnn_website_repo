        <h1>Warum weint der weiße Apfel?</h1>

        <p>Warum weint der weiße Apfel?<br />
Weiß er nicht, dass Winter ist?<br />
Bald fließt Trän' um Träne flink<br />
Am Stamm entlang durch das Geäst</p>
