        <h1>Träume</h1>

        <p>Wie die Wolken, ziehen<br />
Meine Träume<br />
An mir<br />
Vorbei</p>
<p>Und manchmal regnet es<br />
Aus ihnen<br />
Herab<br />
Auf eine Dürre</p>
<p>Und manchmal strahlt die Sonne so,<br />
Dass sie<br />
In ihrem hellen Schein<br />
Alle verblassen</p>
