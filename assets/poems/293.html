        <h1>In der Nacht</h1>

        <p>In der Nacht<br />
springt die Zeit<br />
auf einem Bein<br />
im Kreis –</p>
<p>und wenn die Sonne<br />
sich am Morgen<br />
zeigt,<br />
dann kam sie nicht sehr weit.</p>
