        <h1>Leerer Magen, leerer Mund</h1>

        <p>Leerer Magen, leerer Mund<br />
Lange Suche ohne Fund<br />
Keine Worte, kein Gespür<br />
Auch kein Hunger, kein Gefühl</p>
