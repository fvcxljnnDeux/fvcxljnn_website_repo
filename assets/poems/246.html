        <h1>Erfüllt von einem neuen Glück</h1>

        <p>Erfüllt von einem neuen Glück,<br />
War mir der Tag ein leichter;<br />
Zieht eine Regenwolke auf,<br />
So rückt sie gleich ein Stück –<br />
Geht neben mir ein Zweifel her,<br />
So verbeugt er sich und weicht er.</p>
