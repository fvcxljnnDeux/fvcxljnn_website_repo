        <h1>Heute gibt es kein Gedicht</h1>

        <p>Heute gibt es kein Gedicht –<br />
Der Grund ganz schlicht:<br />
Ich bin zu dicht.<br />
Na ja, so dicht<br />
Vielleicht auch nicht,<br />
Nur will ich langsam schon ins Bett;<br />
Heute gibt es kein Gedicht –<br />
Heute mach' ich früher Schicht.</p>
