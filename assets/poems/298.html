        <h1>Dust is nostalgia seasoning</h1>

        <p>Dust is nostalgia seasoning –<br />
It envelopes memories,<br />
And when you try to brush it off –<br />
Or when you draw into it with your finger –<br />
You can watch it stick on you.</p>
