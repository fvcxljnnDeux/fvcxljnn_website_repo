        <h1>Ein Marathon</h1>

        <p>Ein Semester ist ein Marathon –<br />
Nur wer nie trabt, muss ständig sprinten;<br />
Heut' kam ich sehr faul davon,<br />
Doch morgen heißt es Anschluss finden.</p>
