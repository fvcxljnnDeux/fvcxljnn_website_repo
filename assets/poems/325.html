        <h1>Der Würfelwurf des Karmas</h1>

        <p>Ich kann den Würfelwurf des Karmas<br />
Längst schon nicht mehr deuten –<br />
Ich hoffe nur, es kommt zusammen,<br />
Wenn die Glocken läuten.</p>
