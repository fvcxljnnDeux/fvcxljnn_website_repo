        <h1>Vielleicht bin ich die Blume</h1>

        <p>Langsam strich ich<br />
mit meinen Fingern<br />
durch die zerzausten Halme des hoch-<br />
gewachsenen Rasens – und mir<br />
war, als streichelte ich<br />
das Fell eines gigantischen<br />
Tieres.</p>
