        <h1>Von Träumen in den Schlaf zitiert</h1>

        <p>Von Träumen in den Schlaf zitiert,<br />
Wird heut' schon früh der Dienst quittiert –<br />
Ich schreib' nur schnell die Verse fertig,<br />
Putz' die Zähne, gähne herzlich –<br />
Und dann wird Schaf um Schaf addiert.</p>
