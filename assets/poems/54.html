        <h1>Die Augen sind zwei Hände</h1>

        <p>Die Augen sind zwei Hände,<br />
Die greifen, was sie seh'n –<br />
Dann kneten sie und formen<br />
Aus den mitgepflückten Dornen –<br />
Verdauliche Ideen.</p>
