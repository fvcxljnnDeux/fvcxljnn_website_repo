        <h1>Den Abend in die Nacht gedehnt</h1>

        <p>Den Abend in die Nacht gedehnt<br />
Und grad' wieder Zuhaus' –<br />
Im Kopf noch dort bei der Musik,<br />
Kein Wort kriegst du aus mir mehr raus.</p>
