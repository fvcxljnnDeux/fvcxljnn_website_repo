        <h1>Der Mensch</h1>

        <p>Der Mensch ist sehr eigen,<br />
Der Mensch, er bedarf<br />
Der ständigen Leihe<br />
Von Wachheit im Schlaf;</p>
<p>Es zwingt ihn der Reigen<br />
Von Tränen im Traum,<br />
Sich rückwärts zu zeigen,<br />
Und vorwärts zu schau'n.</p>
