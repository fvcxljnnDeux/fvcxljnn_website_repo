        <h1>Mein Opa ist vor'n Train gejumpt</h1>

        <p>Ich kann es immer noch nicht fassen,<br />
Wie der Schmerz sich in mein Herz gerammt –<br />
Alle Hoffnungen verblassen,<br />
Ja, mein Opa ist vor'n Train gejumpt!</p>
