        <h1>P.J.</h1>

        <p>Upon his recognition<br />
Of my being<br />
Who I was,<br />
I reached out<br />
To his memory –<br />
And offered him my hand.<br />
He read the signs –<br />
Confused –<br />
Outgrown the seasons –<br />
Lost –<br />
And now within him<br />
Slept<br />
The son of time<br />
And its demand.</p>
