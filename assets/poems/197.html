        <h1>Dans l'esprit d'un Arbeitsloser</h1>

        <p>Im Spirit eines Arbeitslosen –<br />
Für manch and'ren wär's ein Unding –<br />
Mach' ich wieder mal die Nacht durch,<br />
Und dann mittwochmorgens Pudding</p>
