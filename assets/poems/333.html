        <h1>Fragen fragen</h1>

        <p>Sie fragten ihre Fragen nicht –<br />
Die Hünen, die im Tageslicht<br />
Auf halber Höhe ragten;<br />
Die Damen, sie beklagten<br />
Traumata der Vorgeschicht',<br />
Und eine viel zu volle Schicht,<br />
Bevor sie sie fortbaten.</p>
