        <h1>Größtes Alibi-Poem</h1>

        <p>Die letzten zwei Tage saß ich in 'nem Loch<br />
Mein Zimmer war stickig und zugemüllt<br />
Jetzt hab ich gelüftet, ausgemistet<br />
Und das Loch, in dem ich saß, ist wieder gefüllt</p>
