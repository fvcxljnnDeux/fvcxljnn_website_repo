        <h1>Danke Klaus</h1>

        <p>Ein ganzes Jahr hat es gedauert –<br />
Dafür darf man mich auch tadeln –<br />
Der Klaus, der hat sich ausgepowert,<br />
Und ich kann wieder radeln.</p>
