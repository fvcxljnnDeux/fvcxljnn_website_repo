        <h1>In der Ferne</h1>

        <p>In der Ferne blass, die Furcht des Herzens,<br />
Doch begeh' ich meinen Weg,<br />
Fängt es an mich arg zu schmerzen –<br />
Ärger noch, wenn ich sie seh'.</p>
