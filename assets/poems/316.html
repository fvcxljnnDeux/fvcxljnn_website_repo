        <h1>In Strahlen</h1>

        <p>Die Sonne kotzt<br />
Mir unbehelligt,<br />
Grell,<br />
Grob,<br />
Und kochend heiß,<br />
Ihr Innerstes –<br />
Ihr'n guten Geist –<br />
In meine müde Finsterkeit.</p>
