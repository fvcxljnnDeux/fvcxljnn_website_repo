        <h1>Mein Pensum ist voll aufgebraucht</h1>

        <p>Mein Pensum ist voll aufgebraucht,<br />
Mein Akku ist entladen;<br />
Die Uhr, kurz einmal draufgeschaut,<br />
Stimmt zu: Ich sollte schlafen!</p>
