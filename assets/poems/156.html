        <h1>Mein Gähnen ist ein Schrei der Kraft</h1>

        <p>Mein Gähnen ist ein Schrei der Kraft<br />
Nach all dem heut' Bewältigten<br />
Das Tun der Zeit ringt mich hernieder<br />
Doch ich leiste Widerstand</p>
