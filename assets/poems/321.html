        <h1>Nachrichtentechnik</h1>

        <p>Es bedarf Fortunas schönster Arie,<br />
Und quasi all der Grazie,<br />
Die ich noch irgend aufbring'n kann –<br />
Doch dann könnt's vom Olymp der weisen<br />
Alten Mathe-Profs her heißen:<br />
"Dies genügt, passier er dann!"</p>
