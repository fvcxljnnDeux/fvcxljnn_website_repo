        <h1>GER : CIV</h1>

        <p>Elfenbeinküste –<br />
Lauern, kontern –<br />
Die schnelle Flügelzange –<br />
Wir haben's nicht mal gesehen –<br />
Kessie!<br />
:<br />
Deutschland –<br />
Eigentlicher Favorit –<br />
Zwei ungültige Tore –<br />
Wir jubeln in Ekstase –<br />
Undav!<br />
Undav!!</p>
