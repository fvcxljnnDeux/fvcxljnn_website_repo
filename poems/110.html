                <span class="poem-index">[110]</span>
                <time class="poem-date" datetime="2025-11-29">29/11/2025</time>
            </header>

            <div class="poem-content">
                <p>Morgen wartet Arbeit,<br />
Morgen braucht es Fleiß;<br />
Heute hab' ich Schonzeit –<br />
Heute ist es nice.</p>
