                <h1 class="poem-title">Vater Winter und Mutter Sonne</h1>
                <span class="poem-index">[73]</span>
                <time class="poem-date" datetime="2025-10-23">23/10/2025</time>
            </header>

            <div class="poem-content">
                <p>Vater Winter ist ein Geizhals,<br />
Mutter Sonne eine Fee;<br />
Wander' ich mit Vati, frier' ich,<br />
Küsst mich Mutti, tut es weh.</p>
            </div>
