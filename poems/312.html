                <span class="poem-index">[312]</span>

            </header>

            <div class="poem-content">
                <p>Pizza –<br />
tiefgekühlt, heiß –<br />
Freund im Morgengrauen.<br />
Ich esse sie müde.<br />
Schlaf.</p>
