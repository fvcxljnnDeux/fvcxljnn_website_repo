                <h1 class="poem-title">Get your shit together</h1>
                <span class="poem-index">[205]</span>
                <time class="poem-date" datetime="2026-03-04">04/03/2026</time>
            </header>

            <div class="poem-content">
                <p>In Aussicht steht nur wenig Schlaf,<br />
Doch dieser muss mir reichen –<br />
Bevor ich morgen doch nicht geh',<br />
Weil Pflichten Komfort weichen.</p>
