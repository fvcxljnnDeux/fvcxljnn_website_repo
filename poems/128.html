                <h1 class="poem-title">Im Tanz liegt eine Freiheit</h1>
                <span class="poem-index">[128]</span>
                <time class="poem-date" datetime="2025-12-17">17/12/2025</time>
            </header>

            <div class="poem-content">
                <p>Im Tanz liegt eine Freiheit,<br />
Die man anders nicht erfährt –<br />
Denn lässt man blind den Körper los,<br />
Bekommt Bewegung neuen Wert.</p>
            </div>
