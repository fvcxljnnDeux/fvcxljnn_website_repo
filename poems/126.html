                <h1 class="poem-title">Manchmal...</h1>
                <span class="poem-index">[126]</span>
                <time class="poem-date" datetime="2025-12-15">15/12/2025</time>
            </header>

            <div class="poem-content">
                <p>Manchmal kann ich endlos reden,<br />
Doch sagen tu' ich dabei nix;<br />
Manchmal bin ich nur am Denken –<br />
Und jeder Satz ist ein Gedix!</p>
