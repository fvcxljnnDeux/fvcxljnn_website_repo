                <h1 class="poem-title">Süße Melodei</h1>
                <span class="poem-index">[309]</span>
                <time class="poem-date" datetime="2026-06-16">16/06/2026</time>
            </header>

            <div class="poem-content">
                <p>Die Müdigkeit greift<br />
Einen Akkord in meinen<br />
Tag und improvisiert<br />
Den Pre-Chorus der Faulheit.<br />
Ich lausche<br />
Ihrem Spiel und schließe<br />
Die Augen.</p>
            </div>
