                <h1 class="poem-title">FSJ-Brief an mein Zukunfts-Ich</h1>
                
                <time class="poem-date" datetime="2023-09-01">01/09/2023</time>
            </header>

            <div class="poem-content">
                <p>Ich hab' vor mir<br />
Ein Blatt Papier,<br />
Elf Monde Zeit,<br />
Und Selbstmitleid.</p>
<p>Ich sehne mich<br />
Nach Wiedersicht<br />
Von Freund und Zeit,<br />
Und Heiterkeit.</p>
            </div>
