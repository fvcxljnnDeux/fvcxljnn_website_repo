                <time class="poem-date" datetime="2022-07-06">06/07/2022</time>
            </header>

            <div class="poem-content">
                <p>Am Sonntag krieche ich hervor,<br />
Und schau' mit dir den neuen Thor –<br />
Denn Love and Thunder lässt erquicken,<br />
Und ich würd' gern' Natalie Portman... sehen!</p>
