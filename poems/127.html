                <h1 class="poem-title">Nachtschicht</h1>
                <span class="poem-index">[127]</span>
                <time class="poem-date" datetime="2025-12-16">16/12/2025</time>
            </header>

            <div class="poem-content">
                <p>Jungs, ich weiß was ihr euch denkt:<br />
"Hat der Boy heut' nicht gedichtet?"<br />
Doch da fühl' ich mich gekränkt,<br />
Hab' ich doch noch nachtgeschichtet.</p>
            </div>
