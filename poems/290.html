                <h1 class="poem-title">Cheap Freedom</h1>
                <span class="poem-index">[290]</span>
                <time class="poem-date" datetime="2026-05-28">28/05/2026</time>
            </header>

            <div class="poem-content">
                <p>It's a cheap but guilty freedom<br />
In-between the waves of stress –<br />
Once you've given up your chance<br />
And sit at rest amid the mess.</p>
