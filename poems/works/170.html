                <span class="poem-index">[170]</span>
                <time class="poem-date" datetime="2026-01-28">28/01/2026</time>
            </header>

            <div class="poem-content">
                <p>Wie die Nacht erneut vorüberzog<br />
Nur ich allein' am wachen<br />
So werd' ich nun, wie gestern schon<br />
Den Tag zur Ruh' mir machen</p>
