                <span class="poem-date date-uncertain">??/??/????</span>

            <div class="poem-content">
                <p>Die kalte Klobrille –<br />
Der Wille warm zu sein –<br />
Doch Nein zu Ärschen sagend,<br />
Bleibt sie stets ganz allein.</p>
