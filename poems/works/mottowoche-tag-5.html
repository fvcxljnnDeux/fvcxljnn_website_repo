            </header>

            <div class="poem-content">
                <p>Unter Weiden<br />
Brennen Bären<br />
Werden Opfer<br />
Außer Augen<br />
Junge Menschen<br />
Haben Hoffnung<br />
Sind vergiftet<br />
Laufen noch</p>
