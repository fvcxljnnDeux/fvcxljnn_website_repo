                <h1 class="poem-title">Lass es gut sein, leeres Blatt</h1>
                <span class="poem-index">[60]</span>
                <time class="poem-date" datetime="2025-10-10">10/10/2025</time>
            </header>

            <div class="poem-content">
                <p>Lass es gut sein, leeres Blatt,<br />
Du bist zwar auch nicht feige –<br />
Doch im Duell setz' ich dich matt,<br />
Denn, Blättelein, ich schreibe.</p>
            </div>
