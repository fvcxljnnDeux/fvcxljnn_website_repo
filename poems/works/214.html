                <span class="poem-index">[214]</span>
                <time class="poem-date" datetime="2026-03-13">13/03/2026</time>
            </header>

            <div class="poem-content">
                <p>nacht war witzing<br />
trotzdem lässt sich<br />
eins zu sagen nicht vertan</p>
<p>morgen werd ich<br />
ja, das schwör ich<br />
mich an iprog setzen dran –<br />
sCurr</p>
            </div>
