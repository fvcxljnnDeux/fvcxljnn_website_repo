                <h1 class="poem-title">Ich werde nun die Augen schließen</h1>
                <span class="poem-index">[354]</span>
                <time class="poem-date" datetime="2026-07-31">31/07/2026</time>
            </header>

            <div class="poem-content">
                <p>Ich werde nun die Augen schließen,<br />
Und lass' das mit dem Wachsein sein –<br />
Prompt hallt es aus den Paradiesen:<br />
"Komme, Kind, und schlaf' ein.. ein."</p>
            </div>
