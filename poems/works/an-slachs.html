                <h1 class="poem-title">An Slachs</h1>
                
                <time class="poem-date" datetime="2025-03-31">31/03/2025</time>
            </header>

            <div class="poem-content">
                <p>Morgen wieder Tag der Scherze,<br />
Mutter wieder Königin –<br />
Dann funkelt Licht von jeder Kerze<br />
Im Halsband für die Köterin.</p>
            </div>
