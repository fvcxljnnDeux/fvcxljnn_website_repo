                <h1 class="poem-title">An Tim</h1>
                
                <time class="poem-date" datetime="2022-12-31">31/12/2022</time>
            </header>

            <div class="poem-content">
                <p>Vielen Dank zum Kauf der Ware,<br />
Wo ich heut' dran saugen werd' –<br />
Lange Stange, braune Farbe –<br />
Dass sich grau mein Gaumen färbt.</p>
            </div>
