                <h1 class="poem-title">An Robi III</h1>
                
                <time class="poem-date" datetime="2021-09-21">21/09/2021</time>
            </header>

            <div class="poem-content">
                <p>Robert du kleines A-Loch,<br />
Du bist so verhasst wie beim Ticken der Ticker –<br />
Und jetzt gibt's für deinen D noch Staub –<br />
Du Staubsaugerficker.</p>
