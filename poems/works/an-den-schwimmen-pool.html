            <header class="poem-header">
                <h1 class="poem-title">An den Schwimmen-Pool</h1>
                
                <time class="poem-date" datetime="2025-10-01">01/10/2025</time>
            </header>

            <div class="poem-content">
                <p>Von Fortuna ihrer selbst gekorbt,<br />
Verspringt mir jeder Ball –<br />
Es ging für mich nicht mal bergauf,<br />
Und trotzdem folgt der Fall.</p>
            </div>
