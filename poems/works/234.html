                <h1 class="poem-title">Schon wieder zwischen Tagen</h1>
                <span class="poem-index">[234]</span>
                <time class="poem-date" datetime="2026-04-02">02/04/2026</time>
            </header>

            <div class="poem-content">
                <p>Schon wieder zwischen Tagen,<br />
War ich wach, doch ohne Wann,<br />
Denn gestern ward vergangen –<br />
Und morgen hinter Glas gefang'n.</p>
