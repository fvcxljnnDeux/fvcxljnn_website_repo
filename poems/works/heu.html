                <span class="poem-date date-uncertain">??/??/????</span>

            <div class="poem-content">
                <p>Wer häufig Heu fickt, scheut sich scheinbar,<br />
Säumt schlicht freudig schäumend' Schleim, der<br />
Seitlich weiblich' Bein langeifert,<br />
Und die Eichel streichelt, rein da!</p>
