                <h1 class="poem-title">An Bane</h1>
                
                <time class="poem-date" datetime="2026-03-02">02/03/2026</time>
            </header>

            <div class="poem-content">
                <p>Dreißig Zentimeter,<br />
Doch es geht nicht um dein' D, Schatzi –<br />
Jedoch auch was für mein Maul,<br />
Und zwar Fetakäs' und Spinaci!</p>
