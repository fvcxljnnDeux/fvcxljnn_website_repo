                <h1 class="poem-title">An Robi XI</h1>
                
                <time class="poem-date" datetime="2023-04-17">17/04/2023</time>
            </header>

            <div class="poem-content">
                <p>Hallo Herr Röbi, ich hörte Sie ham'<br />
Für mich zum Erwerb ein Stück übriges Ram –<br />
Da bin ich vernünftig,<br />
Und biete Ihn'n fünfzig –<br />
Und hole selbst ab, bei Wind und durch Schlamm.</p>
            </div>
