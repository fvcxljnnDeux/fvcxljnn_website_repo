                <time class="poem-date" datetime="2023-03-22">22/03/2023</time>
            </header>

            <div class="poem-content">
                <p>Drei Stunden pure Action<br />
Sind, was fehlt in meiner Welt –<br />
Also öffne ich die Taschen –<br />
Und überschütte dich mit Geld.</p>
