                <h1 class="poem-title">Would that it were so simple...</h1>
                <span class="poem-index">[377]</span>
                <time class="poem-date" datetime="2026-08-23">23/08/2026</time>
            </header>

            <div class="poem-content">
                <p>As he stared at the screen<br />
It reflected his terror –<br />
The nightmare routine –<br />
The error after error.</p>
