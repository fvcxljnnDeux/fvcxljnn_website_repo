                <span class="poem-index">[219]</span>
                <time class="poem-date" datetime="2026-03-18">18/03/2026</time>

            <div class="poem-content">
                <p>Schlaflos pfeift die Nacht –<br />
Durch Baumkronen und Gullideckel –<br />
Ihr einsames Lied.</p>
