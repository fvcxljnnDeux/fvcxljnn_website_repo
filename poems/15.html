                <span class="poem-index">[15]</span>
                <time class="poem-date" datetime="2025-08-26">26/08/2025</time>
            </header>

            <div class="poem-content">
                <p>Die Augen geschlossen,<br />
Der Mund schnappt lautlos nach Luft –<br />
Ein Tosen hinter der Stirn.</p>
            </div>
