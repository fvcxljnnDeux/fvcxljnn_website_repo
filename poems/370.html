                <h1 class="poem-title">A Way, King</h1>
                <span class="poem-index">[370]</span>
                <time class="poem-date" datetime="2026-08-16">16/08/2026</time>
            </header>

            <div class="poem-content">
                <p>Awaking in the dark,<br />
Still to the static of dreams<br />
Buzzing in his ears,<br />
He closed his eyes<br />
And mourned his loss<br />
And listened.</p>
