                <h1 class="poem-title">Die Sonne küsst den Ozean</h1>
                <span class="poem-index">[331]</span>
                <time class="poem-date" datetime="2026-07-08">08/07/2026</time>
            </header>

            <div class="poem-content">
                <p>Die Sonne küsst den Ozean,<br />
Ich kau' an meinen Nägeln –<br />
Sie schreckt mich auf und scheucht mich dann,<br />
Mit ihr davon zu segeln.</p>
