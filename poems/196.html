                <h1 class="poem-title">A Dress For Your Lips</h1>
                <span class="poem-index">[196]</span>
                <time class="poem-date" datetime="2026-02-23">23/02/2026</time>
            </header>

            <div class="poem-content">
                <p>For a while your lips may smile<br />
But once they settle down –<br />
They'll face their woes and changing clothes<br />
They slip into a frown</p>
